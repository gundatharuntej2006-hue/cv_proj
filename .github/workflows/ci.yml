# P3-00 (+ P3 audit FIX 5): CI for every push and pull request.
#   test       - Python 3.11, CPU-only torch, requirements/base.txt (if present) + requirements/p3.txt, pytest (not gpu)
#                with skip reasons; FAILS if a P3 test was skipped because a package is missing; tbcore validators
#                (explicit SKIPPED notice until src/tbcore/ exists, then a hard step)
#   governance - data guard (all branches) + ownership check (pN/... branches), see .github/scripts/ownership_check.py
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      TB_MOCK: "1"
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu   # CPU wheels only: no GPU on runners
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive            # third_party/D-FINE once P1 registers it

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install CPU torch, requirements/base.txt (if present), requirements/p3.txt
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          if [ -f requirements/base.txt ]; then
            pip install -r requirements/base.txt
          else
            echo "::notice::requirements/base.txt not present yet (P1-01); installing P3 requirements only"
          fi
          pip install -r requirements/p3.txt pytest
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"

      - name: pytest (not gpu), skip reasons shown
        run: |
          set +e
          python -m pytest tests -m "not gpu" -rs -p no:cacheprovider 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          set -e
          # a P3 test skipped because a PACKAGE is missing means CI is not really testing P3: fail the job
          python - <<'EOF'
          import re, sys
          bad = [l.strip() for l in open("pytest.log", encoding="utf-8", errors="replace")
                 if l.startswith("SKIPPED") and "tests/p3_" in l.replace("\\", "/") and "could not import" in l]
          if bad:
              print("::error::P3 tests skipped because a package is missing:\n" + "\n".join(bad))
              sys.exit(1)
          EOF
          if [ $code -eq 5 ]; then echo "::warning::no tests collected"; exit 0; fi
          exit $code

      - name: tbcore contract validators
        run: |
          if [ -d src/tbcore ]; then
            echo "src/tbcore exists: validators are a HARD step"
            python -m pytest tests/p3_ops/test_tbcore_adapter.py -q -p no:cacheprovider
            python -m p3_ops.ci_validate
          else
            echo "### tbcore contract validators: SKIPPED: waiting on P4 tbcore (src/tbcore/ not present)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::tbcore contract validators SKIPPED: waiting on P4 tbcore"
          fi

  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Branch names are untrusted input: pass via env, never inline ${{ }} in run.
      - name: Ownership check + data guard (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: >
          python .github/scripts/ownership_check.py
          --base "origin/$BASE_REF" --head "${{ github.event.pull_request.head.sha }}"
          --branch "$HEAD_BRANCH"

      - name: Ownership check + data guard (push to a feature branch)
        if: github.event_name == 'push' && github.ref_name != 'main' && github.ref_type == 'branch'
        env:
          BRANCH: ${{ github.ref_name }}
        run: python .github/scripts/ownership_check.py --base origin/main --head HEAD --branch "$BRANCH"

      - name: Data guard over all tracked files (push to main)
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: python .github/scripts/ownership_check.py --all-tracked --branch main
