name: TB Screening CI

on:
  push:
    branches: [ main, p1, p2, p3, p4 ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Base & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -e . --no-deps

      - name: Validate JSON Schemas and Contracts
        run: |
          python -m pytest tests/test_contracts.py

      - name: Verify Architecture and Code Ownership Rules
        run: |
          python -m pytest tests/test_ownership.py

      - name: Run Core tbcore Tests
        run: |
          python -m pytest tests/test_tbcore.py

  module-tests:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/p1.txt -r requirements/p2.txt -r requirements/p3.txt -r requirements/p4.txt
          pip install -e .

      - name: Run Full Integration & Subsystem Tests
        run: |
          python -m pytest tests/
