# P3-00: CI for every push and pull request.
#   test       - Python 3.11, CPU-only install of requirements/base.txt, pytest (not gpu), tbcore validators
#   governance - data guard (all branches) + ownership check (pN/... branches), see .github/scripts/ownership_check.py
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      # CPU wheels only: no GPU on runners, and CUDA torch wheels are ~2 GB.
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      TB_MOCK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install requirements/base.txt (CPU-only)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements/base.txt ]; then
            pip install -r requirements/base.txt
          else
            echo "::warning::requirements/base.txt not found (P1-01); installing pytest only"
          fi
          pip install pytest
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())" || echo "torch not installed"

      - name: pytest (skip gpu-marked tests)
        run: |
          set +e
          python -m pytest tests -m "not gpu" -ra
          code=$?
          # 5 = no tests collected; acceptable while the repo is a skeleton.
          if [ $code -eq 5 ]; then echo "::warning::no tests collected"; exit 0; fi
          exit $code

      # ---------------------------------------------------------------------------
      # PLACEHOLDER (P3-00): tbcore contract validators.
      # src/tbcore (P4) exposes no validator entry point yet. When it does, delete
      # the warning step below, remove `if: false`, and set the real command.
      # ---------------------------------------------------------------------------
      - name: tbcore contract validators (PLACEHOLDER - disabled)
        if: false
        run: python -m tbcore.validate --all

      - name: tbcore validators not wired yet
        run: echo "::warning::tbcore contract validators are a disabled placeholder in ci.yml (P3-00)"

  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Branch names are untrusted input: pass via env, never inline ${{ }} in run.
      - name: Ownership check + data guard (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: >
          python .github/scripts/ownership_check.py
          --base "origin/$BASE_REF" --head "${{ github.event.pull_request.head.sha }}"
          --branch "$HEAD_BRANCH"

      - name: Ownership check + data guard (push to a feature branch)
        if: github.event_name == 'push' && github.ref_name != 'main' && github.ref_type == 'branch'
        env:
          BRANCH: ${{ github.ref_name }}
        run: python .github/scripts/ownership_check.py --base origin/main --head HEAD --branch "$BRANCH"

      - name: Data guard over all tracked files (push to main)
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: python .github/scripts/ownership_check.py --all-tracked --branch main
